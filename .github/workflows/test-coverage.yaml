# Adapted from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::DT, any::htmltools
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
          covr::report(cov, file = "coverage-report.html", browse = FALSE)

          # Per-file coverage table in the job summary
          pct <- covr::percent_coverage(cov)
          files <- covr::tally_coverage(cov, by = "line")
          by_file <- aggregate(value ~ filename, data = files, FUN = function(v) mean(v > 0) * 100)
          by_file <- by_file[order(by_file$value), ]
          lines <- c(
            sprintf("## Test coverage: %.2f%%", pct),
            "",
            "| File | Coverage |",
            "|------|---------:|",
            sprintf("| `%s` | %.2f%% |", by_file$filename, by_file$value)
          )
          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary_file)) writeLines(lines, summary_file)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # Fail if error only when a token is configured (e.g. not on forks)
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report.html
            lib/
            cobertura.xml
            ${{ runner.temp }}/package
          if-no-files-found: ignore
